name: E2E (preview deployments)

# Layer-2 end-to-end matrix: deploys real Worker preview versions (one per
# config/plugin-set profile) and drives them with synthetic requests, asserting
# on the echoed Approov-Result. Not run on every push — it deploys to Cloudflare
# and needs credentials. Trigger manually.
on:
  workflow_dispatch:

concurrency:
  # All refs share the account's test Worker. Let remote operations finish.
  group: e2e-approov-gateway-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: L2 synthetic matrix (preview)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for E2E."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run L2 e2e matrix
        run: npm run test:e2e
